<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 校园跑腿管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="header" id="header"></div>
      <div class="content">
        <div class="card">
          <div class="card-title">基础设置</div>
          <div style="padding: 16px 0;">
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label">平台名称</label>
              <input type="text" class="form-input" style="max-width: 400px;" value="校园跑腿">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label">客服电话</label>
              <input type="text" class="form-input" style="max-width: 400px;" value="400-XXX-XXXX">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label">客服微信</label>
              <input type="text" class="form-input" style="max-width: 400px;" value="campus_errand_kf">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label">跑腿员保证金</label>
              <input type="text" class="form-input" style="max-width: 400px;" value="100">
            </div>
            <button class="btn btn-primary">保存设置</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">管理员账号</div>
          <table class="data-table">
            <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>最后登录</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td>admin</td><td>系统管理员</td><td><span class="tag purple">超级管理员</span></td><td>2026-09-15 09:00</td><td><span class="tag green">正常</span></td><td><button class="btn-link">修改密码</button></td></tr>
              <tr><td>operator01</td><td>运营小王</td><td><span class="tag blue">运营管理员</span></td><td>2026-09-14 18:30</td><td><span class="tag green">正常</span></td><td><div class="action-group"><button class="btn-link">编辑</button><button class="btn-link danger">禁用</button></div></td></tr>
            </tbody>
          </table>
          <div style="margin-top: 16px;"><button class="btn btn-primary btn-sm">+ 新增管理员</button></div>
        </div>

        <div class="card">
          <div class="card-title">系统信息</div>
          <div style="padding: 16px 0; color: #666; line-height: 2;">
            <p>系统版本：v1.0.0</p>
            <p>前端框架：微信小程序原生 + HTML/CSS/JS</p>
            <p>后端框架：Node.js + Express（待开发）</p>
            <p>数据库：MySQL 8.0</p>
            <p>最后更新：2026-09-15</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>initPage('system', '系统设置');</script>
</body>
</html>
