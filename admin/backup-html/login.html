<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 校园跑腿管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon">🛵</div>
        <div class="logo-title">校园跑腿管理后台</div>
        <div class="logo-desc">Campus Errands Admin System</div>
      </div>
      <div class="form-group">
        <label class="form-label">管理员账号</label>
        <input type="text" class="form-input" id="username" placeholder="请输入管理员账号" value="admin">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="password" placeholder="请输入密码" value="admin123">
      </div>
      <button class="login-btn" onclick="handleLogin()">登 录</button>
      <div class="login-tip">默认账号：admin / 密码：admin123</div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (!username) { alert('请输入管理员账号'); return; }
      if (!password) { alert('请输入密码'); return; }
      if (doLogin(username, password)) {
        window.location.href = 'index.html';
      } else {
        alert('账号或密码错误');
      }
    }
    // 回车登录
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
