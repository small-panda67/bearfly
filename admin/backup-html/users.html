<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 校园跑腿管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="header" id="header"></div>
      <div class="content">
        <div class="stats-row">
          <div class="stat-card blue">
            <div class="stat-label">总用户数</div>
            <div class="stat-value">2,856</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">本月活跃</div>
            <div class="stat-value">1,234</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-label">待实名认证</div>
            <div class="stat-value">5</div>
          </div>
          <div class="stat-card red">
            <div class="stat-label">已冻结</div>
            <div class="stat-value">3</div>
          </div>
        </div>

        <div class="search-bar">
          <input type="text" class="search-input" placeholder="搜索用户名/手机号/用户ID">
          <select class="search-select">
            <option>全部校区</option>
            <option>主校区</option>
            <option>东校区</option>
            <option>西校区</option>
          </select>
          <select class="search-select">
            <option>全部状态</option>
            <option>正常</option>
            <option>冻结</option>
          </select>
          <button class="btn btn-primary">搜索</button>
          <button class="btn btn-outline">导出</button>
        </div>

        <div class="card">
          <table class="data-table">
            <thead>
              <tr>
                <th>用户ID</th>
                <th>昵称</th>
                <th>手机号</th>
                <th>所属校区</th>
                <th>注册时间</th>
                <th>订单数</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTable"></tbody>
          </table>
          <div class="pagination">
            <span class="page-info">共 2,856 条</span>
            <div class="page-btn">‹</div>
            <div class="page-btn active">1</div>
            <div class="page-btn">2</div>
            <div class="page-btn">3</div>
            <div class="page-btn">›</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    initPage('users', '用户管理');
    const tbody = document.getElementById('userTable');
    mockData.users.forEach(u => {
      tbody.innerHTML += `<tr>
        <td>${u.id}</td>
        <td>${u.name}</td>
        <td>${u.phone}</td>
        <td>${u.campus}</td>
        <td>${u.registerTime}</td>
        <td>${u.orders}</td>
        <td>${getStatusTag(u.status)}</td>
        <td>
          <div class="action-group">
            <button class="btn-link">详情</button>
            <button class="btn-link danger">${u.status === '正常' ? '冻结' : '解冻'}</button>
          </div>
        </td>
      </tr>`;
    });
  </script>
</body>
</html>
